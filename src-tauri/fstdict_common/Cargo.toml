[package]
name = "fstdict_common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Match this to your exact tauri v2 version dependency string
tauri = { version = "2.0" } 
log = "0.4.29"
env_logger = "0.11.10"
chrono = "0.4.44"
colored = "2"
tokio = "1.53.1"
urlencoding = "2.1.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
