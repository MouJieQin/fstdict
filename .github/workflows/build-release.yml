name: Build & Release FstDict

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.platform }} (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # macOS Apple Silicon target
                    - os: macos-14
                      platform: macos
                      arch: aarch64
                      rust_target: aarch64-apple-darwin
                      pyinstaller_arch: arm64

                    # macOS Intel target, executed via Rosetta‑2 on ARM runner
                    - os: macos-14
                      platform: macos
                      arch: x86_64
                      rust_target: x86_64-apple-darwin
                      pyinstaller_arch: x86_64

                    # Linux x86_64 target
                    - os: ubuntu-latest
                      platform: linux
                      arch: x86_64
                      rust_target: x86_64-unknown-linux-gnu
                      pyinstaller_arch: x86_64

                    # Windows x86_64 target
                    - os: windows-latest
                      platform: windows
                      arch: x86_64
                      rust_target: x86_64-pc-windows-msvc
                      pyinstaller_arch: AMD64

        # ✨ SIZE & PARTITION FIXES:
        # 1. APPIMAGE_EXTRACT_AND_RUN strips out the FUSE mounting requirement.
        env:
            APPIMAGE_EXTRACT_AND_RUN: 1

        steps:
            - name: Checkout repository source
              uses: actions/checkout@v4

            # ─────────────────────────────────────────
            # 1. Node.js Setup (Fixed Configuration)
            # ─────────────────────────────────────────
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              # No 'version' key needed here; it automatically matches package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            # ─────────────────────────────────────────
            # 2. Setup Python & PyInstaller for backend bundle
            # ─────────────────────────────────────────
            - name: Setup Python
              if: matrix.platform != 'macos' || matrix.arch != 'x86_64'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Setup Python (macos x86_64)
              if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  architecture: "x64"

            - name: Install Python dependencies
              if: matrix.platform != 'macos' || matrix.arch != 'x86_64'
              working-directory: src-python
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pyinstaller

            - name: Install Python dependencies (macos x86_64)
              if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
              working-directory: src-python
              run: |
                  # Force pip execution under Intel architecture to fetch x86_64 binary wheels
                  arch -x86_64 python -m pip install --upgrade pip
                  arch -x86_64 pip install -r requirements.txt
                  arch -x86_64 pip install pyinstaller

            # ─────────────────────────────────────────
            # 3. Rust toolchain & Tauri application build
            # ─────────────────────────────────────────
            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}

            - name: Install Tauri system dependencies (Linux)
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libfuse2 \
                    libwebkit2gtk-4.1-dev \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libxdo-dev \
                    libssl-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libgtk-3-dev \
                    libgstreamer1.0-dev \
                    libgstreamer-plugins-base1.0-dev \
                    gstreamer1.0-plugins-good \
                    gstreamer1.0-plugins-bad \
                    gstreamer1.0-plugins-ugly \
                    gstreamer1.0-tools

            # ─────────────────────────────────────────
            # Build Tauri bundle, create GitHub Release, auto‑generate latest.json manifest
            # Triggered only on version tag push
            # tauri‑action@v0 handles artifact upload, signature files and updater manifest
            # uploadUpdaterJson defaults to true, uploadUpdaterSignatures defaults to true
            # ─────────────────────────────────────────
            - name: Build Tauri application bundle & upload to GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              id: build_release
              uses: tauri-apps/tauri-action@v1
              with:
                  args: --target ${{ matrix.rust_target }} --verbose
                  tagName: ${{ github.ref_name }}
                  releaseName: "${{ github.ref_name }}" # ✨ ADDED THIS LINE
                  releaseBody: "Automated release for version ${{ github.ref_name }}" # ✨ ADDED THIS LINE
                  generateReleaseNotes: true
                  uploadUpdaterJson: true
                  uploadUpdaterSignatures: true
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_TARGET: ${{ matrix.rust_target }}
                  TMPDIR: ${{ github.workspace }}/tmp_build_cache
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
                  LD_LIBRARY_PATH: ${{ github.workspace }}/src-python/dist/fstdict-server/_internal:${{ github.workspace }}/src-python/dist/fstdict-server/_internal/shapely.libs:/usr/local/lib:/usr/lib

            # ─────────────────────────────────────────
            # Build Tauri bundle only, no GitHub Release
            # Triggered only on manual workflow_dispatch
            # ─────────────────────────────────────────
            - name: Build Tauri application bundle (manual build)
              if: github.event_name == 'workflow_dispatch'
              id: build_manual
              uses: tauri-apps/tauri-action@v1
              with:
                  args: --target ${{ matrix.rust_target }} --verbose
                  tagName: "" # ✨ Set to empty string to skip Release creation
                  releaseName: "" # ✨ Set to empty string to skip Release creation
                  uploadWorkflowArtifacts: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_TARGET: ${{ matrix.rust_target }}
                  TMPDIR: ${{ github.workspace }}/tmp_build_cache
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
                  LD_LIBRARY_PATH: ${{ github.workspace }}/src-python/dist/fstdict-server/_internal:${{ github.workspace }}/src-python/dist/fstdict-server/_internal/shapely.libs:/usr/local/lib:/usr/lib

            # ─────────────────────────────────────────
            # Upload build outputs as workflow artifacts (manual dispatch only)
            # Artifacts will be available for download on the workflow run page
            # ─────────────────────────────────────────
            - name: Upload build artifacts
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.platform }}-${{ matrix.arch }}-bundles
                  path: ${{ steps.build_manual.outputs.artifactPaths }}
