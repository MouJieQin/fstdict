<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }

        .wrapper {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 16px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            user-select: none;
            -webkit-user-select: none;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 0.5px solid rgba(255, 255, 255, 0.18);

            opacity: 1;
            transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wrapper.fade-out {
            opacity: 0;
        }

        .icon-container {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div id="container" class="wrapper">
        <img src="/icon.png" class="icon-container" />
        <div id="text" class="message"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const textEl = document.getElementById('text');
        const containerEl = document.getElementById('container');

        if (params.has('message')) {
            textEl.textContent = params.get('message');
        }

        // Hook Tauri event listeners
        const { listen } = window.__TAURI__.event;

        // Listen for fade out event
        listen('start-fade-out', () => {
            console.log("Fade event received, applying CSS class.");
            containerEl.classList.add('fade-out');
        });

        // Listen for message reuse updates
        listen('update-message', (event) => {
            console.log("Update event received. New text:", event.payload);
            textEl.textContent = event.payload;

            // Instantly restore visibility
            containerEl.classList.remove('fade-out');
        });
    </script>
</body>

</html>
